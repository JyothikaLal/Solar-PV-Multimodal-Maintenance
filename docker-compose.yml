services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: solar-pv-api:dev
    container_name: solar-pv-api
    working_dir: /app
    environment:
      APP_ENV: production
      PYTHONPATH: /app
      MLFLOW_TRACKING_URI: sqlite:////mlruns/mlflow.db
    ports:
      - "8000:8000"
    volumes:
      - .:/app:ro
      - ./models:/app/models:ro
      - ./mlruns:/app/mlruns
      - ./reports:/app/reports:ro
    depends_on:
      - mlflow
    command: uvicorn api.app:app --host 0.0.0.0 --port 8000 --workers 2

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.0
    container_name: solar-pv-mlflow
    environment:
      MLFLOW_TRACKING_URI: sqlite:////mlruns/mlflow.db
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlruns/mlflow.db
      --default-artifact-root /mlruns/artifacts
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: solar-pv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - api

  grafana:
    image: grafana/grafana:11.2.0
    container_name: solar-pv-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana_data:
